<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mining & Crafting Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Mining & Crafting</h1>
  <section class="hud">
    <div class="minimap" id="minimap"></div>
    <div class="info-panel">
      <div class="progress" id="progress">
        <div class="bar" id="progress-bar"></div>
        <span id="progress-label">Idle</span>
      </div>
      <div class="resources">
        <h2>Vaše suroviny</h2>
        <div id="resource-totals" class="resource-totals">Žádná data</div>
      </div>
      <div class="tooling">
        <div class="tool-header">
          <h2>Tool status</h2>
          <button id="repair-btn">Repair with Copper Ore</button>
        </div>
        <div id="tool-status" class="tool-status"></div>
      </div>
    </div>
  </section>

  <section class="crafting">
    <h2>Crafting</h2>
    <div class="crafting-panel">
      <div class="inventory" id="inventory"></div>
      <div class="recipe" id="recipe" data-recipe-id="1">
        <h3>Bronze Ingot</h3>
        <div class="requirements" id="requirements"></div>
        <div class="drop-target" id="drop-target">Drag materials here</div>
        <button id="craft-btn">Craft</button>
      </div>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
